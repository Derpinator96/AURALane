[tool.pytest.ini_options]
# _external/ and shaurya-webapp/ are vendored repositories with their own
# suites; they are not our gate. Setting norecursedirs replaces pytest's
# default list, so the defaults (pytest 9.1.1) are repeated after ours.
norecursedirs = [
    "_external", "shaurya-webapp", ".venv",
    "*.egg", ".*", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}",
]
markers = [
    "privacy: de-identification checks; skipped ones are counted in the run summary",
    "local_data: needs data that is not in git (images/, data/ corpora, fixtures)",
    "slow: minutes, not seconds; skipped (loudly) unless AURALANE_RUN_SLOW=1",
]
